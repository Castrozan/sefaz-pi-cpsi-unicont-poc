{% extends "base.html" %}
{% block title %}{{ label }}{% endblock %}
{% block content %}
<h1>{{ label }}</h1>
<p class="meta">Processo <a href="{{ routes.process(process_number) }}">{{ process_number }}</a> · documento {{ document_id }} · <a href="{{ routes.document_original(document_id) }}">{{ routes.document_original_label }}</a></p>
{% for page in pages %}
<article class="pagina"><h2>Página {{ page.number }}</h2><p>{{ page.html }}</p></article>
{% endfor %}
{% endblock %}
